[project]
name = "oj-midlayer"
version = "2.0.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["app/gen"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests poll a real broker / shared fakes; a sleep loop under asyncio.timeout is the simplest way.
"tests/**" = ["ASYNC109", "ASYNC110"]
