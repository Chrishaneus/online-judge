syntax = "proto3";

package oj.v1;

import "oj/v1/types.proto";

// HTTP API of the api service, served at /api/v1. Each route's body is its
// *Request message (minus path parameters) and its response is the matching
// *Response message, both as canonical proto JSON. The route is written above
// each request message.
//
// Errors: every non-2xx response body is oj.v1.ErrorResponse.
//   400  malformed JSON / unknown field / non-numeric path or query parameter
//   401  missing or invalid admin token (admin routes)
//   403  admin API disabled (ADMIN_TOKEN not configured)
//   404  problem / submission / test case not found, or unknown route
//   405  method not allowed
//   409  duplicate problem slug
//   413  body too large
//   422  validation failed (error names the field)
//   429  rate limited (Retry-After) or judging queue full
//   500  unexpected error (logged; details not exposed)
//   503  database or RabbitMQ unreachable
//   504  a custom run got no runner answer in time
//
// GET /api/v1/admin/verify (admin token check, answers {"admin": true}) and
// GET /healthz (liveness) have no messages.

// ---------- status ----------

// GET /api/v1/status
message GetStatusRequest {}

message GetStatusResponse {
  // True when the database and RabbitMQ are both reachable.
  bool healthy = 1;
  // "ok" or "error: <reason>".
  string database = 2;
  string broker = 3;
  // Judging jobs waiting in RabbitMQ.
  int64 queue_depth = 4;
  // Runner processes currently consuming jobs.
  int32 runners = 5;
}

message LanguageInfo {
  Language language = 1;
  // Display name, e.g. "Python 3".
  string name = 2;
}

// GET /api/v1/languages
message ListLanguagesRequest {}

message ListLanguagesResponse {
  repeated LanguageInfo languages = 1;
}

// ---------- problems ----------

message ProblemSummary {
  int64 id = 1;
  string slug = 2;
  string title = 3;
  Difficulty difficulty = 4;
  int32 time_limit_ms = 5;
  int32 memory_limit_mb = 6;
}

message ProblemDetail {
  int64 id = 1;
  string slug = 2;
  string title = 3;
  Difficulty difficulty = 4;
  int32 time_limit_ms = 5;
  int32 memory_limit_mb = 6;
  // Markdown.
  string statement = 7;
  // Only sample tests; hidden tests are never exposed.
  repeated Sample samples = 8;
}

// GET /api/v1/problems
message ListProblemSummariesRequest {}

message ListProblemSummariesResponse {
  repeated ProblemSummary problems = 1;
}

// GET /api/v1/problems/{id}
message GetProblemDetailRequest {
  int64 id = 1;
}

message GetProblemDetailResponse {
  ProblemDetail problem = 1;
}

// ---------- submissions ----------

// POST /api/v1/submissions (rate limited) -> 202
message SubmitRequest {
  int64 problem_id = 1;
  Language language = 2;
  // 1..262144 characters.
  string source = 3;
  // [A-Za-z0-9_.-]{1,32}; empty means "anonymous".
  string username = 4;
}

message SubmitResponse {
  // Status PENDING; poll GetSubmissionDetail for the verdict.
  Submission submission = 1;
}

// GET /api/v1/submissions?problemId=&username=&limit=&offset=
message ListSubmissionSummariesRequest {
  int64 problem_id = 1;
  string username = 2;
  // 1..200; 0 means 50.
  int32 limit = 3;
  int32 offset = 4;
}

message ListSubmissionSummariesResponse {
  // source, message and results are empty.
  repeated Submission submissions = 1;
}

// GET /api/v1/submissions/{id}
message GetSubmissionDetailRequest {
  int64 id = 1;
}

message GetSubmissionDetailResponse {
  Submission submission = 1;
}

// ---------- custom run ----------

// POST /api/v1/run (rate limited). Runs code against custom input, no judging.
message RunCodeRequest {
  Language language = 1;
  string source = 2;
  // At most 1 MiB.
  string stdin = 3;
  // When set, use this problem's time and memory limits (else 2000 ms / 256 MB).
  int64 problem_id = 4;
}

message RunCodeResponse {
  RunStatus status = 1;
  // Set when status is COMPILATION_ERROR.
  string compile_output = 2;
  string stdout = 3;
  string stderr = 4;
  int32 exit_code = 5;
  int32 time_ms = 6;
  int64 memory_kb = 7;
}

// ---------- admin ----------

message NewTestCase {
  string input = 1;
  string expected_output = 2;
  bool is_sample = 3;
}

// POST /api/v1/admin/problems -> 201
message AddProblemRequest {
  string slug = 1;
  string title = 2;
  string statement = 3;
  // UNSPECIFIED means EASY.
  Difficulty difficulty = 4;
  // 100..15000; 0 means 2000.
  int32 time_limit_ms = 5;
  // 16..1024; 0 means 256.
  int32 memory_limit_mb = 6;
  // 1..200 test cases, each input/output at most 8 MiB.
  repeated NewTestCase test_cases = 7;
}

message AddProblemResponse {
  ProblemDetail problem = 1;
}

// PUT /api/v1/admin/problems/{id}
message EditProblemRequest {
  int64 id = 1;
  string slug = 2;
  string title = 3;
  string statement = 4;
  Difficulty difficulty = 5;
  int32 time_limit_ms = 6;
  int32 memory_limit_mb = 7;
}

message EditProblemResponse {
  ProblemSummary problem = 1;
}

// DELETE /api/v1/admin/problems/{id} -> 204
message RemoveProblemRequest {
  int64 id = 1;
}

message RemoveProblemResponse {}

// GET /api/v1/admin/problems/{problemId}/testcases
message ListProblemTestCasesRequest {
  int64 problem_id = 1;
}

message ListProblemTestCasesResponse {
  repeated TestCase test_cases = 1;
}

// POST /api/v1/admin/problems/{problemId}/testcases -> 201
message AddTestCaseRequest {
  int64 problem_id = 1;
  NewTestCase test_case = 2;
}

message AddTestCaseResponse {
  TestCase test_case = 1;
}

// DELETE /api/v1/admin/problems/{problemId}/testcases/{id} -> 204
message RemoveTestCaseRequest {
  int64 problem_id = 1;
  int64 id = 2;
}

message RemoveTestCaseResponse {}
