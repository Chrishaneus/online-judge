syntax = "proto3";

package oj.v1;

import "google/protobuf/timestamp.proto";
import "oj/v1/types.proto";

// DaoService is oj-dao's internal gRPC API: plain persistence, no business
// rules. Only oj-midlayer calls it. oj-dao is the only service that talks to
// PostgreSQL.
//
// Errors (gRPC status codes):
//   NOT_FOUND            the entity, or a referenced parent, does not exist
//   ALREADY_EXISTS       a uniqueness constraint was violated (problem slug)
//   INVALID_ARGUMENT     malformed request (missing id, unknown enum, ...)
//   FAILED_PRECONDITION  UpdateSubmission.expected_status did not match
//   UNAVAILABLE          the database is unreachable
// Liveness/readiness: the standard grpc.health.v1.Health service (it pings the DB).
service DaoService {
  rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse);
  rpc GetProblem(GetProblemRequest) returns (GetProblemResponse);
  // Creates the problem and its test cases in one transaction.
  rpc CreateProblem(CreateProblemRequest) returns (CreateProblemResponse);
  rpc UpdateProblem(UpdateProblemRequest) returns (UpdateProblemResponse);
  // Cascades to test cases and submissions.
  rpc DeleteProblem(DeleteProblemRequest) returns (DeleteProblemResponse);

  rpc ListTestCases(ListTestCasesRequest) returns (ListTestCasesResponse);
  // Appends a test case; ordinal is assigned as max(ordinal) + 1.
  rpc CreateTestCase(CreateTestCaseRequest) returns (CreateTestCaseResponse);
  rpc DeleteTestCase(DeleteTestCaseRequest) returns (DeleteTestCaseResponse);

  rpc CreateSubmission(CreateSubmissionRequest) returns (CreateSubmissionResponse);
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse);
  // Newest first. Returned submissions are complete (source and results included).
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse);
  rpc UpdateSubmission(UpdateSubmissionRequest) returns (UpdateSubmissionResponse);
}

message ListProblemsRequest {}

message ListProblemsResponse {
  // Ordered by id.
  repeated Problem problems = 1;
}

message GetProblemRequest {
  int64 id = 1;
}

message GetProblemResponse {
  Problem problem = 1;
}

message CreateProblemRequest {
  // id and create_time are ignored.
  Problem problem = 1;
  // id and problem_id are ignored; ordinal is assigned in list order from 1.
  repeated TestCase test_cases = 2;
}

message CreateProblemResponse {
  Problem problem = 1;
  repeated TestCase test_cases = 2;
}

message UpdateProblemRequest {
  // Replaces slug, title, statement, difficulty and limits of problem.id.
  Problem problem = 1;
}

message UpdateProblemResponse {
  Problem problem = 1;
}

message DeleteProblemRequest {
  int64 id = 1;
}

message DeleteProblemResponse {}

message ListTestCasesRequest {
  int64 problem_id = 1;
  bool samples_only = 2;
}

message ListTestCasesResponse {
  // Ordered by ordinal.
  repeated TestCase test_cases = 1;
}

message CreateTestCaseRequest {
  // id and ordinal are ignored.
  TestCase test_case = 1;
}

message CreateTestCaseResponse {
  TestCase test_case = 1;
}

message DeleteTestCaseRequest {
  int64 problem_id = 1;
  int64 id = 2;
}

message DeleteTestCaseResponse {}

message CreateSubmissionRequest {
  // Only problem_id, username, language and source are used; the rest starts
  // as PENDING / UNSPECIFIED / zero.
  Submission submission = 1;
}

message CreateSubmissionResponse {
  Submission submission = 1;
}

message GetSubmissionRequest {
  int64 id = 1;
}

message GetSubmissionResponse {
  Submission submission = 1;
}

message ListSubmissionsRequest {
  // Filters; zero values mean "any".
  int64 problem_id = 1;
  string username = 2;
  repeated SubmissionStatus statuses = 3;
  // Only submissions last updated before this instant.
  google.protobuf.Timestamp updated_before = 4;
  // 1..500; 0 means 50.
  int32 limit = 5;
  int32 offset = 6;
}

message ListSubmissionsResponse {
  repeated Submission submissions = 1;
}

message TestResults {
  repeated TestResult results = 1;
}

// Partial update: only fields that are set are written. update_time is
// always bumped.
message UpdateSubmissionRequest {
  int64 id = 1;
  optional SubmissionStatus status = 2;
  optional Verdict verdict = 3;
  optional int32 passed = 4;
  optional int32 total = 5;
  optional int32 time_ms = 6;
  optional string message = 7;
  // Set to replace the results (an empty TestResults clears them).
  TestResults results = 8;
  // Compare-and-set: when non-empty, the update is applied only if the
  // current status is one of these, else FAILED_PRECONDITION. Used to make
  // judging idempotent (a late or duplicate result never overwrites a
  // finished submission).
  repeated SubmissionStatus expected_statuses = 9;
}

message UpdateSubmissionResponse {
  Submission submission = 1;
}
