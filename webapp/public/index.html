<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Judge</title>
  <meta name="description" content="Solve programming problems and get your code judged instantly.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">&#10003; Online Judge</a>
    <nav>
      <a href="#/" data-nav="problems">Problems</a>
      <a href="#/submissions" data-nav="submissions">Submissions</a>
      <a href="#/admin" data-nav="admin">Admin</a>
    </nav>
    <label class="handle">
      <span>Handle</span>
      <input id="username" maxlength="32" autocomplete="nickname" spellcheck="false" placeholder="anonymous">
    </label>
  </header>
  <main id="app" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="container">This application requires JavaScript.</p></noscript>
</body>
</html>
