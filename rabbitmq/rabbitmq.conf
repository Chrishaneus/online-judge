# Users, permissions and queues come from definitions.json, rendered at startup
# by the broker-setup service. With definitions loaded, no default guest user
# is created.
load_definitions = /etc/rabbitmq/defs/definitions.json

# Judging jobs carry every test input; allow large batches (default is 16 MiB).
max_message_size = 134217728

# Only AMQP is exposed on the network. Erlang distribution (CLI tools) is bound
# to loopback through RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS / ERL_EPMD_ADDRESS in
# docker-compose.yml, so the runners' network (where untrusted code runs) can
# reach nothing but the AMQP port.
listeners.tcp.default = 5672

# The image enables the Prometheus plugin; keep its endpoint off the network too.
prometheus.tcp.ip = 127.0.0.1
