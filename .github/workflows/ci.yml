# Same gates as `make check`, plus the Postgres/RabbitMQ integration tests and
# the full stack end to end. Required on every PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@v6
      - run: make -C proto setup
      - run: make check-proto

  runner:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env: { RABBITMQ_DEFAULT_USER: oj, RABBITMQ_DEFAULT_PASS: oj }
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-retries 30
    defaults: { run: { working-directory: runner } }
    env: { RABBITMQ_TEST_URL: "amqp://oj:oj@localhost:5672/" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: runner/go.mod, cache-dependency-path: runner/go.sum }
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -race ./...

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: oj, POSTGRES_PASSWORD: oj, POSTGRES_DB: oj_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U oj" --health-interval 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env: { RABBITMQ_DEFAULT_USER: oj, RABBITMQ_DEFAULT_PASS: oj }
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-retries 30
    defaults: { run: { working-directory: api } }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://oj:oj@localhost:5432/oj_test
      RABBITMQ_TEST_URL: amqp://oj:oj@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -r requirements-dev.txt
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q

  webapp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: webapp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: webapp/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run lint && npm run check
      - run: npm run test:unit && npm run test:component

  e2e:
    runs-on: ubuntu-latest
    needs: [proto, runner, api, webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: make env && make up
      - run: cd webapp && npm ci && npx playwright install --with-deps chromium
      # e2e first: both suites hit the per-IP rate limit from the same address, and
      # only smoke.py waits out 429s.
      - run: make e2e
        env: { CI: "1" }
      - run: make smoke
      - if: failure()
        run: docker compose logs
