# Online Judge: full stack.
#
#   browser ─> webapp (SvelteKit :3000, published :8080)
#                │ proto JSON
#                v
#              api (Flask :8000) ──> postgres
#              worker (same image) ─┘
#                │ AMQP (api publishes jobs, worker consumes results)
#                v
#              rabbitmq  judge.jobs ─> runner × RUNNER_REPLICAS
#                        judge.events <─┘
#
# Each service is built from its directory; see README.md and AGENTS.md.
# Contract: proto/oj/v1/*.proto (proto/README.md describes it).

name: online-judge

x-restart: &restart
  restart: unless-stopped

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oj
      POSTGRES_USER: oj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oj-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj -d oj"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: renders RabbitMQ users/permissions/queues from the passwords
  # below (stored hashed) before the broker boots.
  broker-setup:
    image: python:3.13-alpine
    command: ["python", "/src/render_definitions.py"]
    environment:
      API_PASSWORD: ${RABBITMQ_API_PASSWORD:-api-dev-password}
      RUNNER_PASSWORD: ${RABBITMQ_RUNNER_PASSWORD:-runner-dev-password}
      OUT: /defs/definitions.json
    volumes:
      - ./rabbitmq/render_definitions.py:/src/render_definitions.py:ro
      - rabbitmq-defs:/defs
    network_mode: none
    <<: *hardened
    restart: "no"

  rabbitmq:
    <<: [*restart, *hardened]
    image: rabbitmq:4-alpine
    # Start as the unprivileged user directly, so no capabilities are needed.
    user: rabbitmq
    hostname: rabbitmq
    environment:
      # Erlang distribution (CLI tools, healthcheck) on loopback only: the jobs
      # network, where untrusted code runs, can reach nothing but AMQP.
      RABBITMQ_NODENAME: rabbit@localhost
      ERL_EPMD_ADDRESS: 127.0.0.1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-kernel inet_dist_use_interface {127,0,0,1}"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-oj.conf:ro
      - rabbitmq-defs:/etc/rabbitmq/defs:ro
      - rabbitmq-data:/var/lib/rabbitmq
    tmpfs: [/tmp]
    depends_on:
      broker-setup: { condition: service_completed_successfully }
    networks: [backend, jobs]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 20

  runner:
    <<: *restart
    build: ./runner
    image: online-judge/runner:latest
    # Untrusted code runs here. Its only network is `jobs` (internal, nothing on
    # it but RabbitMQ's AMQP port). Broker credentials are least-privilege
    # (consume judge.jobs, publish events) and invisible to sandboxed code.
    environment:
      RABBITMQ_URL: amqp://runner:${RABBITMQ_RUNNER_PASSWORD:-runner-dev-password}@rabbitmq:5672/
      RUNNER_WORKERS: ${RUNNER_WORKERS:-2}
      RUNNER_SANDBOX_DIR: /sandbox
    tmpfs:
      - /sandbox:size=512m,mode=0711,exec,nosuid,nodev
      - /tmp:size=64m,nosuid,nodev
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [jobs]
    deploy:
      replicas: ${RUNNER_REPLICAS:-2}
    # Lets in-flight jobs finish (RUNNER_SHUTDOWN_TIMEOUT_S, default 60s) before
    # SIGKILL; anything still running is requeued by the broker.
    stop_grace_period: 75s
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${RUNNER_MEM_LIMIT:-2g}
    cpus: ${RUNNER_CPUS:-2}

  # HTTP API (/api/v1): controllers -> services -> repositories (Postgres,
  # RabbitMQ). Runs the DB migrations, then gunicorn.
  api:
    <<: [*restart, *hardened]
    build: ./api
    image: online-judge/api:latest
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://oj:${POSTGRES_PASSWORD:-oj-dev-password}@postgres:5432/oj
      RABBITMQ_URL: amqp://api:${RABBITMQ_API_PASSWORD:-api-dev-password}@rabbitmq:5672/
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-5}
      # The webapp forwards the visitor's IP in X-Real-IP.
      TRUST_PROXY_HEADERS: "true"
      RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-30}
      MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-1000}
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [db, backend, frontend]
    ports:
      - "${API_PORT:-127.0.0.1:8000}:8000"

  # Background consumer (same image): judges runner results from judge.events,
  # fails dead-lettered jobs, re-publishes stale submissions on start.
  worker:
    <<: [*restart, *hardened]
    image: online-judge/api:latest
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
    networks: [db, backend]

  webapp:
    <<: [*restart, *hardened]
    build:
      context: ./webapp
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    image: online-judge/webapp:latest
    environment:
      API_URL: http://api:8000/api/v1
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    ports:
      - "${WEB_PORT:-8080}:3000"
    tmpfs: [/tmp]

networks:
  # postgres, api, worker
  db:
    internal: true
  # rabbitmq, api, worker
  backend:
    internal: true
  # Runners + RabbitMQ only. Internal: no internet.
  jobs:
    internal: true
  # webapp, api
  frontend: {}

volumes:
  pgdata: {}
  rabbitmq-data: {}
  rabbitmq-defs: {}
